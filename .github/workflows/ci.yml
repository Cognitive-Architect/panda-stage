name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  classify:
    name: Classify change risk
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      areas: ${{ steps.classify.outputs.areas }}
      suites: ${{ steps.classify.outputs.suites }}
      reason: ${{ steps.classify.outputs.reason }}
      comparison_mode: ${{ steps.classify.outputs.comparison_mode }}
      incremental_baseline: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find proven same-PR Full-green baseline
        id: baseline
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.event.action != 'ready_for_review' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/find-full-green-baseline.cjs

      - name: Classify changed files from manifest
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INCREMENTAL_BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: node scripts/ci-routing.cjs classify

      - name: Record risk classification
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          TIER: ${{ steps.classify.outputs.tier }}
          REASON: ${{ steps.classify.outputs.reason }}
          AREAS: ${{ steps.classify.outputs.areas }}
          SUITES: ${{ steps.classify.outputs.suites }}
          COMPARISON_MODE: ${{ steps.classify.outputs.comparison_mode }}
          INCREMENTAL_BASELINE: ${{ steps.baseline.outputs.sha }}
          BASELINE_REASON: ${{ steps.baseline.outputs.reason }}
        shell: bash
        run: |
          {
            echo '## CI risk classification'
            echo ''
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Draft: \`$IS_DRAFT\`"
            echo "- Tier: \`$TIER\`"
            echo "- Reason: $REASON"
            echo "- Comparison: \`$COMPARISON_MODE\`"
            echo "- Incremental baseline: \`${INCREMENTAL_BASELINE:-none}\`"
            echo "- Baseline proof: ${BASELINE_REASON:-not requested}"
            echo "- Areas: \`$AREAS\`"
            echo "- Suites: \`$SUITES\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality_docs:
    name: Docs-only fast path
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.tier == 'docs' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Validate docs-only scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ ^((README|AGENTS)\.md|docs(/[^/]*)*/[^/]+\.md)$ ]]; then
              echo "Unexpected docs-only path: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Validate Markdown relative links
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const root = process.cwd();
          const files = execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter((file) => /\.md$/i.test(file));
          const linkPattern = /\[[^\]]*\]\(([^)\s]+)(?:\s+['"][^'"]*['"])?\)/g;
          const errors = [];
          for (const file of files) {
            const source = fs.readFileSync(path.join(root, file), 'utf8');
            let match;
            while ((match = linkPattern.exec(source)) !== null) {
              const target = match[1];
              if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(target) || target.startsWith('#')) continue;
              const targetPath = decodeURIComponent(target.split('#', 1)[0]);
              if (!targetPath) continue;
              const resolved = path.resolve(root, path.dirname(file), targetPath);
              if ((!resolved.startsWith(root + path.sep) && resolved !== root) || !fs.existsSync(resolved)) {
                errors.push(`${file}: invalid relative target: ${target}`);
              }
            }
          }
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log(`Validated relative links in ${files.length} Markdown file(s).`);
          NODE

  quality_targeted:
    name: Targeted quality and regression
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.tier == 'targeted' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record selected route
        shell: pwsh
        env:
          RISK_REASON: ${{ needs.classify.outputs.reason }}
          RISK_AREAS: ${{ needs.classify.outputs.areas }}
          RISK_SUITES: ${{ needs.classify.outputs.suites }}
          COMPARISON_MODE: ${{ needs.classify.outputs.comparison_mode }}
          INCREMENTAL_BASELINE: ${{ needs.classify.outputs.incremental_baseline }}
        run: |
          "## Targeted CI path" >> $env:GITHUB_STEP_SUMMARY
          "- Reason: $env:RISK_REASON" >> $env:GITHUB_STEP_SUMMARY
          "- Comparison: ``$env:COMPARISON_MODE``" >> $env:GITHUB_STEP_SUMMARY
          "- Incremental baseline: ``$env:INCREMENTAL_BASELINE``" >> $env:GITHUB_STEP_SUMMARY
          "- Areas: ``$env:RISK_AREAS``" >> $env:GITHUB_STEP_SUMMARY
          "- Suites: ``$env:RISK_SUITES``" >> $env:GITHUB_STEP_SUMMARY
      - uses: pnpm/action-setup@v4
        name: Set up pnpm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            $env:force_no_cache = 'true'
            pnpm exec electron --version
          }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime binary was not installed.'
          }
          pnpm exec electron --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Run manifest-selected subsystem regression suites
        shell: pwsh
        env:
          RISK_SUITES: ${{ needs.classify.outputs.suites }}
        run: |
          foreach ($suite in $env:RISK_SUITES.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            & pnpm "verify:$suite"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  quality_full:
    name: Full quality and regression
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.tier == 'full' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record selected route
        shell: pwsh
        env:
          RISK_REASON: ${{ needs.classify.outputs.reason }}
          RISK_SUITES: ${{ needs.classify.outputs.suites }}
        run: |
          "## Full CI path" >> $env:GITHUB_STEP_SUMMARY
          "- Reason: $env:RISK_REASON" >> $env:GITHUB_STEP_SUMMARY
          "- Manifest suites: ``$env:RISK_SUITES``" >> $env:GITHUB_STEP_SUMMARY
      - uses: pnpm/action-setup@v4
        name: Set up pnpm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            $env:force_no_cache = 'true'
            pnpm exec electron --version
          }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime binary was not installed.'
          }
          pnpm exec electron --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Run manifest-selected full regression suites
        shell: pwsh
        env:
          RISK_SUITES: ${{ needs.classify.outputs.suites }}
        run: |
          foreach ($suite in $env:RISK_SUITES.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            & pnpm "verify:$suite"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  quality:
    name: Final CI result
    if: ${{ always() }}
    needs:
      - classify
      - quality_docs
      - quality_targeted
      - quality_full
    runs-on: ubuntu-latest
    steps:
      - name: Publish stable final result
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          TIER: ${{ needs.classify.outputs.tier }}
          REASON: ${{ needs.classify.outputs.reason }}
          AREAS: ${{ needs.classify.outputs.areas }}
          SUITES: ${{ needs.classify.outputs.suites }}
          DOCS_RESULT: ${{ needs.quality_docs.result }}
          TARGETED_RESULT: ${{ needs.quality_targeted.result }}
          FULL_RESULT: ${{ needs.quality_full.result }}
        run: |
          set -euo pipefail
          {
            echo '## Final CI result'
            echo ''
            echo "- Tier: \`$TIER\`"
            echo "- Reason: $REASON"
            echo "- Areas: \`$AREAS\`"
            echo "- Suites: \`$SUITES\`"
            echo "- Classifier: \`$CLASSIFIER_RESULT\`"
            echo "- Docs-only: \`$DOCS_RESULT\`"
            echo "- Targeted: \`$TARGETED_RESULT\`"
            echo "- Full: \`$FULL_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CLASSIFIER_RESULT" == success ]]
          case "$TIER" in
            docs) [[ "$DOCS_RESULT" == success && "$TARGETED_RESULT" == skipped && "$FULL_RESULT" == skipped ]] ;;
            targeted) [[ "$DOCS_RESULT" == skipped && "$TARGETED_RESULT" == success && "$FULL_RESULT" == skipped ]] ;;
            full) [[ "$DOCS_RESULT" == skipped && "$TARGETED_RESULT" == skipped && "$FULL_RESULT" == success ]] ;;
            *) echo "Unknown tier: $TIER" >&2; exit 1 ;;
          esac
          echo 'Stable final CI result: success.'
