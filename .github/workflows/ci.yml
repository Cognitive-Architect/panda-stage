name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  core:
    name: Core CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine docs-only scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-routing.cjs scope
      - name: Validate diff whitespace
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check $env:BASE_SHA $env:HEAD_SHA
      - name: Validate documentation links
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-routing.cjs check-docs
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck
      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint
      - name: Unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:unit
      - name: Integration tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:integration
      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
      - name: Summarize checks
        if: always()
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          JOB_STATUS: ${{ job.status }}
        run: |
          "## Core CI: $env:JOB_STATUS" >> $env:GITHUB_STEP_SUMMARY
          if ($env:DOCS_ONLY -eq 'true') {
            "Docs only: diff check and relative links; no dependency install." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Core: diff check, typecheck, lint, unit, integration, build." >> $env:GITHUB_STEP_SUMMARY
          }

  final:
    name: Final CI result
    needs: core
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          echo "Core CI: $CORE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$CORE_RESULT" = success
