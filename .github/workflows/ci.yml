name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Day 13 recovery renderer gate
        run: pnpm verify:day13

      - name: Day 14 recent-project renderer gate
        run: pnpm verify:day14

      - name: M1 project lifecycle gate
        run: pnpm verify:m1

      - name: Day 16 asset import gate
        run: pnpm verify:day16

      - name: Day 17 asset metadata gate
        run: pnpm verify:day17

      - name: Day 18 asset library gate
        run: pnpm verify:day18

      - name: Day 19 character definitions gate
        run: pnpm verify:day19

      - name: Day 20 shot management M2 gate
        run: pnpm verify:day20

      - name: Day 21 fixed canvas and viewport gate
        run: pnpm verify:day21

      - name: Day 22 layer placement gate
        run: pnpm verify:day22

      - name: Day 23 layer transform and order gate
        run: pnpm verify:day23

      - name: Day 24 command history gate
        run: pnpm verify:day24

      - name: Issue 73 project-switch and open-flow gate
        run: pnpm verify:issue73

      - name: Issue 76 Stage 1B create / preview / close gate
        run: pnpm verify:issue76

      - name: Issue 102 Task 1 project center gate
        run: pnpm verify:issue102-task1

      - name: Issue 102 Task 2 compact project bar gate
        run: pnpm verify:issue102-task2

      - name: Issue 102 Task 3 project safety contract gate
        run: pnpm verify:issue102-task3
