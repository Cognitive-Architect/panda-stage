name: Full CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full quality and regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Prepare Electron
        run: |
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            $env:force_no_cache = 'true'
            pnpm exec electron --version
          }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime binary was not installed.'
          }
      - name: Full regression suites
        run: |
          $fullSuites = (node scripts/ci-routing.cjs full-suites).Trim().Split(' ')
          foreach ($suite in $fullSuites) {
            & pnpm "verify:$suite"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: '"Full CI: $env:JOB_STATUS (manual heavy path)" >> $env:GITHUB_STEP_SUMMARY'
